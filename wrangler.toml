name = "revel-event-hub"
main = "src/worker/index.js"
compatibility_date = "2025-03-13"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

# Uncomment and configure once DB is provisioned:
# [[d1_databases]]
# binding = "DB"
# database_name = "revel-bsw"
# database_id = ""

# Uncomment once R2 bucket is created:
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "revel-assets"

[env.production]
name = "revel-event-hub"
vars = { ENVIRONMENT = "production" }
