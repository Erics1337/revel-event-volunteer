<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Subject }} — Boulder Startup Week 2026</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap');
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #F5F5F5;
      -webkit-font-smoothing: antialiased;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #FFFFFF;
    }
    
    .header {
      background: #2B8A8F;
      padding: 30px;
      text-align: center;
    }
    
    .logo {
      margin-bottom: 12px;
    }
    
    .logo img {
      height: 40px;
      width: auto;
    }
    
    .header h1 {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }
    
    .header-subtitle {
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      margin: 8px 0 0 0;
    }
    
    .content {
      padding: 40px 30px;
    }
    
    .subject {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-size: 24px;
      font-weight: 600;
      color: #333333;
      margin: 0 0 24px 0;
      line-height: 1.3;
    }
    
    .message {
      font-size: 16px;
      color: #333333;
      line-height: 1.7;
      margin: 0;
    }
    
    .message p {
      margin: 0 0 16px 0;
    }
    
    .message p:last-child {
      margin-bottom: 0;
    }
    
    .footer {
      background-color: #F5F5F5;
      padding: 30px;
      text-align: center;
      border-top: 1px solid #E5E5E5;
    }
    
    .footer p {
      color: #666666;
      font-size: 14px;
      margin: 0 0 8px 0;
    }
    
    .footer a {
      color: #2B8A8F;
      text-decoration: none;
    }
    
    .admin-badge {
      display: inline-block;
      background: #F58220;
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    
    @media only screen and (max-width: 600px) {
      .content {
        padding: 30px 20px;
      }
      
      .subject {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <img src="{{ .SiteURL }}/bsw-logo-BUCTZ2oQ.png" alt="Boulder Startup Week" />
      </div>
      <h1>Boulder Startup Week 2026</h1>
      <p class="header-subtitle">Message from the Volunteer Team</p>
    </div>
    
    <div class="content">
      <div class="admin-badge">VOLUNTEER UPDATE</div>
      
      <h2 class="subject">{{ .Subject }}</h2>
      
      <div class="message">
        {{ .Message }}
      </div>
    </div>
    
    <div class="footer">
      <p><strong>Boulder Startup Week 2026</strong></p>
      <p>May 4–8, 2026 • Boulder, Colorado</p>
      <p style="margin-top: 16px; font-size: 12px; color: #999999;">
        Questions? Reply to this email or contact <a href="mailto:volunteers@boulderstartupweek.com">volunteers@boulderstartupweek.com</a>
      </p>
    </div>
  </div>
</body>
</html>
